<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>오류 | Operation Hub</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
<link rel="stylesheet" th:href="@{/assets/vendor/bootstrap-5.3.8/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
</head>
<body>
<div class="error-page">
    <div class="error-code" th:text="${status}">500</div>
    <h2 th:switch="${status}">
        <span th:case="404">요청하신 페이지를 찾을 수 없습니다.</span>
        <span th:case="403">접근 권한이 없습니다.</span>
        <span th:case="*">처리 중 오류가 발생했습니다.</span>
    </h2>
    <p class="text-secondary">문제가 계속되면 관리자에게 문의하세요.</p>
    <a class="btn btn-success mt-3" th:href="@{/sample/home}">홈으로</a>
</div>
</body>
</html>
