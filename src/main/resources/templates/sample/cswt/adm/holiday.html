<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>휴일 관리</title>
    <link rel="stylesheet" th:href="@{/assets/vendor/fullcalendar-7.1.3/skeleton.css}">
    <link rel="stylesheet" th:href="@{/assets/vendor/fullcalendar-7.1.3/themes/classic/theme.css}">
    <link rel="stylesheet" th:href="@{/assets/vendor/fullcalendar-7.1.3/themes/classic/palette.css}">
    <link rel="stylesheet" th:href="@{/assets/css/cswt/adm.css}">
</head>
<body>
<!-- CS Webtool adm/adm_holiday.jsp: 왼쪽 월 캘린더(이전/제목/다음) + 오른쪽 그 해 공휴일 목록(캘린더 높이만큼 스크롤)
     + 아래 공휴일 추가 줄. 휴일/목록을 누르면 휴일 정보 수정 모달. 데이터는 화면 안 배열 (새로고침하면 처음으로). -->
<main layout:fragment="content">
    <div class="page-title">
        <h3>휴일 관리</h3>
    </div>

    <form id="holidayForm" novalidate th:attr="data-modal-url=@{/sample/cswt/adm/modal/holiday-add}">
        <div class="x_panel">
            <div class="x_content">
                <div class="row g-3">
                    <div class="col-md-6">
                        <div id="calendarArea"></div>
                    </div>
                    <div class="col-md-6">
                        <h4 class="holiday-list-title" id="holidayListTitle">2026년 공휴일 리스트</h4>
                        <div class="table-responsive holiday-list" id="tableArea">
                            <table class="table table-striped jambo_table">
                                <thead>
                                <tr>
                                    <th>공휴일</th>
                                    <th>날짜</th>
                                    <th>요일</th>
                                </tr>
                                </thead>
                                <tbody id="holidayRows"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-lg-6 offset-lg-6">
                        <div class="table-responsive holiday-add">
                            <table class="table jambo_table">
                                <colgroup>
                                    <col>
                                    <col style="width: 45%;">
                                    <col style="width: 70px;">
                                </colgroup>
                                <tbody>
                                <tr>
                                    <td>공휴일명</td>
                                    <td>날짜</td>
                                    <td></td>
                                </tr>
                                <tr>
                                    <td>
                                        <input type="text" class="form-control" name="date_name" placeholder="공휴일명을 입력해주세요." aria-label="공휴일명" required>
                                    </td>
                                    <td>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-calendar3"></i></span>
                                            <input type="date" class="form-control" name="locdate" aria-label="날짜" required>
                                        </div>
                                    </td>
                                    <td><button class="btn btn-success" type="button" id="btnAddHoliday">추가</button></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</main>

<th:block layout:fragment="script">
    <script th:src="@{/assets/vendor/fullcalendar-7.1.3/fullcalendar.global.js}"></script>
    <script th:src="@{/assets/vendor/fullcalendar-7.1.3/themes/classic/classic.global.js}"></script>
    <script th:src="@{/assets/vendor/fullcalendar-7.1.3/locales/ko.global.js}"></script>
    <script th:src="@{/assets/js/oh-calendar.js}"></script>
    <script th:inline="none">
        (function () {
            const form = document.getElementById('holidayForm');
            const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
            let seq = 100;
            // 2026년 공휴일 (CS Webtool 은 공공데이터 API 로 받아 저장)
            const holidays = [
                ['2026-01-01', '신정'], ['2026-02-16', '설날'], ['2026-02-17', '설날'], ['2026-02-18', '설날'],
                ['2026-03-01', '삼일절'], ['2026-03-02', '대체공휴일'], ['2026-05-05', '어린이날'],
                ['2026-05-24', '부처님오신날'], ['2026-05-25', '대체공휴일'], ['2026-06-03', '전국동시지방선거'],
                ['2026-06-06', '현충일'], ['2026-08-15', '광복절'], ['2026-08-17', '대체공휴일'],
                ['2026-09-24', '추석'], ['2026-09-25', '추석'], ['2026-09-26', '추석'],
                ['2026-10-03', '개천절'], ['2026-10-05', '대체공휴일'], ['2026-10-09', '한글날'], ['2026-12-25', '기독탄신일']
            ].map(([date, name], i) => ({ idx: i + 1, date, name }));

            let year = 2026;
            const dayOf = date => new Date(date + 'T00:00:00').getDay();

            function renderList() {
                document.getElementById('holidayListTitle').textContent = year + '년 공휴일 리스트';
                const rows = holidays.filter(h => h.date.startsWith(year + '-')).sort((a, b) => a.date.localeCompare(b.date));
                const tbody = document.getElementById('holidayRows');
                tbody.innerHTML = rows.length ? '' : '<tr class="no-data"><td colspan="3">목록이 없습니다.</td></tr>';
                rows.forEach(h => {
                    const d = dayOf(h.date);
                    const tr = document.createElement('tr');
                    tr.dataset.idx = h.idx;
                    if (d === 0 || d === 6) tr.className = 'row-weekend';
                    tr.innerHTML = '<td><a href="#" class="holiday-pop"></a></td><td></td><td></td>';
                    tr.querySelector('a').textContent = h.name;
                    tr.cells[1].textContent = h.date.replace(/-/g, '.');
                    tr.cells[2].textContent = WEEK[d];
                    tbody.appendChild(tr);
                });
            }

            const cal = oh.calendar('#calendarArea', {
                initialDate: '2026-10-24',
                headerToolbar: { left: 'prev', center: 'title', right: 'next' },
                eventColor: '#3a87ad',
                events: (info, success) => success(holidays.map(h => ({ id: String(h.idx), title: h.name, start: h.date, allDay: true }))),
                eventClick: info => openModal(Number(info.event.id)),
                datesSet: arg => {
                    // 보이는 달의 가운데 날짜 기준 연도
                    const mid = new Date((arg.start.getTime() + arg.end.getTime()) / 2);
                    if (mid.getFullYear() !== year) { year = mid.getFullYear(); renderList(); }
                }
            });
            renderList();

            // 오른쪽 목록 높이를 캘린더 높이에 맞춤
            const calEl = document.getElementById('calendarArea');
            const fit = () => {
                const wide = window.matchMedia('(min-width: 768px)').matches;
                document.getElementById('tableArea').style.height = wide ? (calEl.offsetHeight - 34) + 'px' : '';
            };
            new ResizeObserver(fit).observe(calEl);

            function openModal(idx) {
                const h = holidays.find(x => x.idx === idx);
                if (h) oh.modal.open(form.dataset.modalUrl, { idx: h.idx, name: h.name, date: h.date });
            }
            document.addEventListener('click', e => {
                const a = e.target.closest('#tableArea .holiday-pop');
                if (a) { e.preventDefault(); openModal(Number(a.closest('tr').dataset.idx)); }
            });

            // 모달(_holiday-add.html)에서 호출
            window.holidayUpdate = (idx, name, date) => {
                const h = holidays.find(x => x.idx === idx);
                if (h) { h.name = name; h.date = date; }
                cal.refetchEvents(); renderList();
            };
            window.holidayDelete = idx => {
                const i = holidays.findIndex(x => x.idx === idx);
                if (i > -1) holidays.splice(i, 1);
                cal.refetchEvents(); renderList();
            };

            // 공휴일 추가
            document.getElementById('btnAddHoliday').addEventListener('click', () => {
                const name = form.date_name, date = form.locdate;
                name.classList.toggle('is-invalid', !name.value.trim());
                date.classList.toggle('is-invalid', !date.value);
                if (!name.value.trim()) { oh.toast('공휴일명을 입력해주세요.', 'warning'); name.focus(); return; }
                if (!date.value) { oh.toast('날짜를 입력해주세요.', 'warning'); date.focus(); return; }
                holidays.push({ idx: ++seq, name: name.value.trim(), date: date.value });
                cal.gotoDate(date.value);
                cal.refetchEvents(); renderList();
                name.value = ''; date.value = '';
                oh.toast('저장이 완료되었습니다.');
            });
            form.addEventListener('input', e => e.target.classList.remove('is-invalid'));
        })();
    </script>
</th:block>
</body>
</html>
