<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 임시 비밀번호 사용 안내 (CS Webtool com/req_passwd_change.jsp).
     비밀번호를 바꿀 때까지 닫을 수 없음: X 버튼 없음, 바깥 클릭/ESC 무시 (backdrop static). -->
<div class="modal fade" tabindex="-1" aria-labelledby="reqPasswdTitle" aria-hidden="true"
     data-bs-backdrop="static" data-bs-keyboard="false" th:fragment="modal">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header justify-content-center">
                <h5 class="modal-title" id="reqPasswdTitle">비밀번호 변경 부탁드립니다.</h5>
            </div>
            <div class="modal-body">
                <p class="mb-1 fw-bold">임시 비밀번호를 사용중입니다.</p>
                <p class="mb-0 fw-bold">특수문자, 영어 소문자/대문자, 숫자 포함 8자리 이상 16자리 이하인 비밀번호로 변경 요청드립니다.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-success" id="btnReqPasswdChange"
                        th:attr="data-passwd-url=@{/sample/cswt/com/modal/passwd-change}">비밀번호 변경</button>
            </div>
        </div>
    </div>
    <script>
        (function () {
            const btn = document.getElementById('btnReqPasswdChange');
            const modal = btn.closest('.modal');
            // 모달 영역(#modal_area)은 하나라서 안내창을 닫은 뒤 비밀번호 변경 모달을 띄움
            btn.addEventListener('click', () => {
                modal.addEventListener('hidden.bs.modal', () => oh.modal.open(btn.dataset.passwdUrl), { once: true });
                bootstrap.Modal.getInstance(modal).hide();
            });
        })();
    </script>
</div>
</body>
</html>
