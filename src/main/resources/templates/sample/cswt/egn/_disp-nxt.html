<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 방문예약 (CS Webtool egn/disp/call_nxt.jsp). 바로 출동하지 않고 방문 일정을 잡은 건.
     nosid=1 이면 SYSTEM ID 입력칸 표시, mode=update 면 저장된 값으로 채움 -->
<div class="modal fade" tabindex="-1" aria-labelledby="dispNxtTitle" aria-hidden="true" th:fragment="modal"
     th:with="upd=${param.mode != null and param.mode[0] == 'update'}">
    <div class="modal-dialog modal-dialog-centered">
        <form class="modal-content" novalidate>
            <div class="modal-header">
                <h5 class="modal-title" id="dispNxtTitle">방문예약</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
            </div>
            <div class="modal-body">
                <div class="row g-2 align-items-start mb-2" th:if="${param.nosid != null}">
                    <div class="col-sm-3"><label class="col-form-label text-sm-end d-block" for="nxSystemId">SYSTEM ID</label></div>
                    <div class="col-sm-9">
                        <input type="text" class="form-control" id="nxSystemId" name="system_id" placeholder="SYSTEM_ID 입력" required>
                        <div class="invalid-feedback">SYSTEM_ID 를 입력해주세요.</div>
                    </div>
                </div>
                <div class="row g-2 align-items-start mb-2">
                    <div class="col-sm-3"><label class="col-form-label text-sm-end d-block" for="nxCloseStat">처리결과</label></div>
                    <div class="col-sm-9">
                        <select class="form-select" id="nxCloseStat" name="close_stat">
                            <option value="OPN">Open</option>
                            <option value="CLS" th:selected="${upd}">Close</option>
                            <option value="N2F">Need to Follow</option>
                        </select>
                    </div>
                </div>
                <div class="row g-2 align-items-start mb-2">
                    <div class="col-sm-3"><label class="col-form-label text-sm-end d-block" for="nxStrtTime">일시작시간</label></div>
                    <div class="col-sm-9">
                        <input type="text" inputmode="numeric" maxlength="4" class="form-control input-time" id="nxStrtTime" name="strt_time"
                               placeholder="0000" pattern="([01][0-9]|2[0-3])[0-5][0-9]" required th:value="${upd} ? '2215' : ''">
                        <div class="invalid-feedback">일시작시간을 HHMM 형식으로 입력해주세요.</div>
                    </div>
                </div>
                <div class="row g-2 align-items-start mb-2">
                    <div class="col-sm-3"><label class="col-form-label text-sm-end d-block" for="nxEndTime">일종료시간</label></div>
                    <div class="col-sm-9">
                        <input type="text" inputmode="numeric" maxlength="4" class="form-control input-time" id="nxEndTime" name="end_time"
                               placeholder="0000" pattern="([01][0-9]|2[0-3])[0-5][0-9]" required th:value="${upd} ? '2230' : ''">
                        <div class="invalid-feedback">일종료시간을 HHMM 형식으로 입력해주세요.</div>
                    </div>
                </div>
                <div class="row g-2 align-items-start mb-2">
                    <div class="col-sm-3"><label class="col-form-label text-sm-end d-block" for="nxNotiTitle">장애명</label></div>
                    <div class="col-sm-9">
                        <input type="text" class="form-control" id="nxNotiTitle" name="noti_title" placeholder="장애명을 입력하세요" required
                               th:value="${upd} ? 'Table movement error' : ''">
                        <div class="invalid-feedback">장애명을 입력해주세요.</div>
                    </div>
                </div>
                <div class="row g-2 align-items-start mb-2">
                    <div class="col-sm-3"><label class="col-form-label text-sm-end d-block" for="nxNotiPriority">장애등급</label></div>
                    <div class="col-sm-9">
                        <select class="form-select" id="nxNotiPriority" name="noti_priority" required>
                            <option value="">장애등급 선택</option>
                            <option value="PS1">PS1</option>
                            <option value="PS2">PS2</option>
                            <option value="PS3" th:selected="${upd}">PS3</option>
                        </select>
                        <div class="invalid-feedback">장애등급을 선택해주세요.</div>
                    </div>
                </div>
                <div class="row g-2">
                    <div class="col-sm-3"><label class="col-form-label text-sm-end d-block" for="nxOsrRem">처리내역</label></div>
                    <div class="col-sm-9">
                        <textarea class="form-control" rows="10" id="nxOsrRem" name="osr_rem" placeholder="처리내역을 입력하세요" required
                                  th:text="${upd} ? '병원 요청으로 10-25(일) 09:00 방문 예약. 당일 검사 일정 없음 확인.' : ''"></textarea>
                        <div class="invalid-feedback">처리내역을 입력해주세요.</div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-dark" data-bs-dismiss="modal">닫기</button>
                <button type="submit" class="btn btn-success">저장하기</button>
            </div>
        </form>
    </div>
    <script>
        (function () {
            var modal = document.currentScript.closest('.modal');
            var form = modal.querySelector('form');
            // HHMM 입력칸은 숫자만
            form.querySelectorAll('.input-time').forEach(function (el) {
                el.addEventListener('input', function () { el.value = el.value.replace(/\D/g, ''); });
            });
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                form.classList.add('was-validated');
                var bad = form.querySelector(':invalid');
                if (bad) { bad.focus(); return; }
                bootstrap.Modal.getInstance(modal).hide();
                oh.toast('저장이 완료되었습니다.', 'success');
            });
        })();
    </script>
</div>
</body>
</html>
