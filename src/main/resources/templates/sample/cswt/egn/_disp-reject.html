<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- DISP Reject (CS Webtool egn/disp/call_disp_reject.jsp). nosid=1 이면 SYSTEM ID 입력칸 표시 -->
<div class="modal fade" tabindex="-1" aria-labelledby="dispRejectTitle" aria-hidden="true" th:fragment="modal">
    <div class="modal-dialog modal-dialog-centered">
        <form class="modal-content" novalidate>
            <div class="modal-header">
                <h5 class="modal-title" id="dispRejectTitle">DISP Reject</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
            </div>
            <div class="modal-body">
                <div class="row g-2 align-items-start mb-2" th:if="${param.nosid != null}">
                    <div class="col-sm-4"><label class="col-form-label text-sm-end d-block" for="rjSystemId">SYSTEM ID</label></div>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" id="rjSystemId" name="system_id" placeholder="SYSTEM_ID" required>
                        <div class="invalid-feedback">SYSTEM_ID 를 입력해주세요.</div>
                    </div>
                </div>
                <div class="row g-2">
                    <div class="col-sm-4"><label class="col-form-label text-sm-end d-block" for="rjDispRem">특기사항</label></div>
                    <div class="col-sm-8">
                        <textarea class="form-control" rows="15" id="rjDispRem" name="disp_rem" placeholder="특기사항을 입력하세요" required></textarea>
                        <div class="invalid-feedback">특기사항을 입력해주세요.</div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-dark" data-bs-dismiss="modal">닫기</button>
                <button type="submit" class="btn btn-success">저장하기</button>
            </div>
        </form>
    </div>
    <script>
        (function () {
            var modal = document.currentScript.closest('.modal');
            var form = modal.querySelector('form');
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                form.classList.add('was-validated');
                var bad = form.querySelector(':invalid');
                if (bad) { bad.focus(); return; }
                bootstrap.Modal.getInstance(modal).hide();
                oh.toast('저장이 완료되었습니다.', 'success');
            });
        })();
    </script>
</div>
</body>
</html>
