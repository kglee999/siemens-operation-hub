<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 자동배정 설정 모달 (CS Webtool egn_assign_auto_set.jsp). CS Webtool 처럼 조회 전용. -->
<div class="modal fade" tabindex="-1" aria-labelledby="dutyAutoTitle" aria-hidden="true" th:fragment="modal">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h5 class="modal-title" id="dutyAutoTitle">DI 엔지니어 자동배정 설정</h5>
                    <small class="text-navy">DI 자동배정 설정을 하실 수 있습니다.</small>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
            </div>
            <div class="modal-body">
                <table class="table table-striped jambo_table mb-0">
                    <thead>
                    <tr>
                        <th style="width: 120px;">지역</th>
                        <th style="width: 80px;">GG</th>
                        <th>&nbsp;</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${rows}">
                        <td th:text="${r.branchNm}">서울/경기</td>
                        <td th:text="${r.gg}">CT</td>
                        <td>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" value="Y" disabled
                                       th:id="|auto${r.branchCd}${r.gg}Y|" th:name="|auto${r.branchCd}${r.gg}|" th:checked="${r.autoAssignYn == 'Y'}">
                                <label class="form-check-label" th:for="|auto${r.branchCd}${r.gg}Y|">자동배정</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" value="N" disabled
                                       th:id="|auto${r.branchCd}${r.gg}N|" th:name="|auto${r.branchCd}${r.gg}|" th:checked="${r.autoAssignYn == 'N'}">
                                <label class="form-check-label" th:for="|auto${r.branchCd}${r.gg}N|">순번관리 사용</label>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-dark" data-bs-dismiss="modal">닫기</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
