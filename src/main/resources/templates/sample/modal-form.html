<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 모달 등록/수정 폼. SampleController#modalForm 이 이 조각만 내려준다. -->
<div class="modal fade" tabindex="-1" aria-labelledby="userModalTitle" aria-hidden="true" th:fragment="modal">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <form class="modal-content" th:action="@{/sample/modal/save}" method="post" novalidate>
            <input type="hidden" name="mode" th:value="${mode}">
            <div class="modal-header">
                <h5 class="modal-title" id="userModalTitle" th:text="${mode == 'modify'} ? '사용자 수정' : '사용자 등록'">사용자 등록</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
            </div>
            <div class="modal-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="mEmplNo" class="form-label">사용자 NO <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="mEmplNo" name="emplNo" required maxlength="10"
                               th:value="${user?.emplNo}" th:readonly="${mode == 'modify'}" placeholder="예) E0100">
                        <div class="invalid-feedback">사용자 NO를 입력하세요.</div>
                    </div>
                    <div class="col-md-6">
                        <label for="mName" class="form-label">사용자명 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="mName" name="name" required maxlength="20"
                               th:value="${user?.name}">
                        <div class="invalid-feedback">사용자명을 입력하세요.</div>
                    </div>
                    <div class="col-md-6">
                        <label for="mTeam" class="form-label">조직 <span class="text-danger">*</span></label>
                        <select class="form-select" id="mTeam" name="team" required>
                            <option value="">선택</option>
                            <option th:each="t : ${teams}" th:value="${t}" th:text="${t}"
                                    th:selected="${user != null and user.team == t}">운영1팀</option>
                        </select>
                        <div class="invalid-feedback">조직을 선택하세요.</div>
                    </div>
                    <div class="col-md-6">
                        <label for="mPhone" class="form-label">Mobile</label>
                        <input type="tel" class="form-control" id="mPhone" name="phone" placeholder="010-0000-0000"
                               th:value="${user?.phone}">
                    </div>
                    <div class="col-md-6">
                        <label for="mEmail" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="mEmail" name="email" th:value="${user?.email}">
                        <div class="invalid-feedback">E-mail 형식을 확인하세요.</div>
                    </div>
                    <div class="col-md-6">
                        <span class="form-label d-block">권한</span>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="grade" id="mGrade1" value="1"
                                   th:checked="${user == null or user.grade == '1'}">
                            <label class="form-check-label" for="mGrade1">일반</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="grade" id="mGrade2" value="2"
                                   th:checked="${user != null and user.grade == '2'}">
                            <label class="form-check-label" for="mGrade2">당직 관리</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="grade" id="mGrade9" value="9"
                                   th:checked="${user != null and user.grade == '9'}">
                            <label class="form-check-label" for="mGrade9">Admin</label>
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" role="switch" id="mUseYn" name="useYn" value="true"
                                   th:checked="${user == null or user.useYn}">
                            <label class="form-check-label" for="mUseYn">사용 여부</label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-bs-dismiss="modal">취소</button>
                <button type="submit" class="btn btn-success" th:text="${mode == 'modify'} ? '수정하기' : '등록하기'">등록하기</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
